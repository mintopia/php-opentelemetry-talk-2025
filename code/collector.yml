receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
  otlp:
    endpoint: "api.eu1.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "xxxx"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]
